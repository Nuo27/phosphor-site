  <text x="400" y="632" text-anchor="middle" font-family="'JetBrains Mono','IBM Plex Mono',ui-monospace,monospace" font-size="30" letter-spacing="8" fill="#00FF9C" fill-opacity="0.85">PHOSPHOR</text>
