### Site Settings ###
title: Phosphor
description: >-
  A magazine-grade Jekyll personal-site template with a tactical-telemetry
  aesthetic — phosphor-green-on-void-dark HUD UI, CRT grain, and scan lines.
baseurl: "/phosphor-site"
repository: Nuo27/phosphor-site
url: "https://nuo27.github.io" # deployed origin; required for feed, sitemap, and OG previews

### Navigation ###
# Top navbar links, in display order. `label` is the visible text; `url` is the
# destination. Active state is automatic: the root entry matches only on `/`,
# every other entry is active on an exact match OR any sub-path (so `/portfolio/`
# also lights up on `/portfolio/<project>/`). Omit `label` to fall back to the
# target page's `title`.
nav:
  - { label: About, url: /about/ }
  - { label: Portfolio, url: /portfolio/ }
  - { label: Articles, url: /articles/ }

### Author Info ###
author:
  name: Phosphor
  image: assets/image/logo/phosphor-avatar.svg # 1:1 — hero portrait + OG default
  location: Open Source · MIT

### Social Links (rendered by _includes/social.html) ###
social:
  - name: GitHub
    icon: github
    prefix: fab
    url: "https://github.com/Nuo27/phosphor-site"

### Collections ###
collections:
  projects:
    output: true
    permalink: /portfolio/:name
  articles:
    output: true
    permalink: /articles/:name

### Defaults for collections ###
defaults:
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"
  - scope:
      path: ""
      type: "articles"
    values:
      layout: "article"

### Plugins ###
# jekyll-sitemap → /sitemap.xml for search engines
plugins:
  - jekyll-sitemap

### Portfolio visibility (site-wide defaults) ###
# accent_tag:  tag name highlighted in accent color on cards/chips (e.g. "Open Source").
# hidden_*:    tags/categories collapsed behind the SHOW toggle on the portfolio grid.
# dimmed_*:    tags/categories shown but de-emphasized.
# Page front matter (pages/projects.md → portfolio:) overrides these per-field.
portfolio:
  subtitle: "A Jekyll template, shown on itself."
  accent_tag: ""
  hidden_tags: []
  hidden_categories: []
  dimmed_tags: []
  dimmed_categories: []
  hidden_label: "hidden" # short noun; shown uppercased in the toggle button
  filter_label: "FILTER" # the // label over the category chips
  show_label: "SHOW" # the // label over the reveal-toggle chips

### Exclude from processing ###
exclude:
  - README.md
  - CONTRIBUTING.md
  - LICENSE
  - AUDIT.md
  - "*.log"
  - integrations/
