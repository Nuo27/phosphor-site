<nav id="site-navbar" class="navbar navbar-expand-lg navbar-themed">

  <a class="navbar-brand {% if page.url == '/' %}active{% endif %}" href="{{ site.baseurl }}/"><h5><b>{{ site.title }}</b></h5></a>

  <div class="navbar-collapse" id="navbarNavAltMarkup">
    <div class="navbar-nav ml-auto">
      {% for item in site.nav %}
      <a class="nav-item nav-link {% if item.url == '/' %}{% if page.url == '/' %}active{% endif %}{% else %}{% if page.url == item.url or page.url contains item.url %}active{% endif %}{% endif %}" href="{{ item.url | prepend: site.baseurl }}">{{ item.label }}</a>
      {% endfor %}
    </div>
  </div>

  <!-- Always-visible actions (outside collapse so they show on every viewport) -->
  <div class="nav-right">
    <button id="theme-toggler" type="button" onclick="toggleTheme()" aria-label="Toggle dark mode" title="Toggle theme"></button>

    <button class="navbar-toggler" type="button" id="nav-toggle" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
      <i class="fas fa-1x fa-bars text-themed"></i>
    </button>
  </div>

</nav>
